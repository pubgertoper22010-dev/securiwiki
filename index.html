<style>
:root{--bg:#eef3f4;--panel:#fff;--ink:#0e1a20;--mute:#4d6168;--line:#cfdcdf;--ac:#00798c;--acink:#fff;--soft:#dcecef;--red:#d92d3a;--yel:#e8a300;--grn:#1f9d55;

body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.row{display:flex;gap:8px;max-width:520px}

.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 1.6rem "JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;color:#fff;flex:none}

.sw{display:flex;gap:8px}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button[aria-pressed="true"]{border-color:var(--ink)}
.btn{padding:12px 20px;font:700 16px "IBM Plex Sans",sans-serif;border:0;border-radius:4px;background:var(--ac);color:var(--acink);cursor:pointer}
.btn.ghost{background:none;border:2px solid var(--ac);color:var(--ac)}
.prog{height:12px;background:var(--line);border-radius:6px;overflow:hidden;max-width:520px;margin:8px 0}.prog i{display:block;height:100%;background:var(--ac)}

.note{background:var(--soft);border-radius:4px;padding:14px 16px;font-size:15px;margin:16px 0}

.acts{display:flex;gap:10px;flex-wrap:wrap}.acts a{text-decoration:none;display:inline-block}
.shw{justify-self:center;text-align:center;max-width:340px}
.shield{width:100%;height:auto}
.shw small{display:block;color:var(--mute);font-size:14px;line-height:1.5;margin-top:4px}
.ring{fill:none;stroke:var(--ac);stroke-width:2}
.rg{transform-origin:150px 150px;animation:spin 40s linear infinite}
.rg.b{animation-duration:28s;animation-direction:reverse}
.core{transform-origin:150px 150px;animation:pulse 3.2s ease-in-out infinite}
.tg{transform-origin:150px 150px;transform:rotate(var(--a))}
.tg circle{fill:var(--red);opacity:0;transform-box:fill-box;transform-origin:center;animation:thr 5s ease-in infinite;animation-delay:var(--d)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes thr{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:1}58%{transform:translateY(28px) scale(1);opacity:1}70%,100%{transform:translateY(28px) scale(2.6);opacity:0}}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0 8px}
.about .topic{margin:0}.about h3{font-size:1rem;margin-bottom:8px}.about p{margin:0;font-size:16px}
h2.sec{font-size:1.4rem;margin:32px 0 16px}

.ut th,.ut td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}

.btn.dn{border-color:var(--red);color:var(--red)}.btn:disabled,.ut select:disabled{opacity:.45;cursor:not-allowed}
body{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{letter-spacing:-.02em}
.topic{border-left:4px solid var(--ac)}
.card{border-top:3px solid var(--ac)}
.crumb,nav#nav h2,.kpi div{font-family:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace}
.crumb{font-size:13px}
nav a[aria-current="page"]::before{content:"> "}
nav a:not([aria-current="page"]):hover::before{content:"> ";color:var(--ac)}
.hero2 h1::before{content:"$ ";color:var(--ac)}
.hero2{position:relative}.hero2>div{position:relative;z-index:1}
#cv{position:absolute;inset:0;width:100%;height:100%;opacity:.25;pointer-events:none;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
@media (prefers-reduced-motion:no-preference){
.pg{animation:fin .35s ease both}@keyframes fin{from{opacity:0;transform:translateY(8px)}}

@keyframes up{from{opacity:0;transform:translateY(18px)}}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px -10px var(--ac)}
.hero2 h1::after{content:"_";color:var(--ac);animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}
.bl{fill:none;stroke:var(--red);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:bl 5s ease-out infinite;animation-delay:var(--d)}
@keyframes bl{0%,57%{opacity:0;transform:scale(1)}59%{opacity:.9}85%,100%{opacity:0;transform:scale(5)}}
.sweep{transform-origin:150px 150px;animation:spin 6s linear infinite}
.prog i,.hb .t i{animation:grow 1s ease-out}@keyframes grow{from{width:0}}
.cols i{animation:rise .9s ease-out}@keyframes rise{from{height:0}}
.meter[data-l="red"]{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.meter[data-l="green"] i{box-shadow:0 0 12px var(--grn)}
#lvl.red::after{content:" \26A0"}#lvl.green::after{content:" \1F512";display:inline-block;animation:pop .45s}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.3)}}
.chk li.ok::before{animation:pop .35s}}
@media (prefers-reduced-motion:reduce){.sweep,.bl{display:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(560px,calc(100% - 32px));background:var(--panel);color:var(--ink);border:2px solid var(--ac);border-radius:6px;padding:14px 16px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast input{width:100%;margin-top:8px;padding:10px;font:14px monospace;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.toast button{margin-top:8px;float:right}
.cb{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:780px;margin:0 auto;background:var(--panel);border:2px solid var(--ac);border-radius:6px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cb p{margin:0 0 12px;font-size:15px;line-height:1.55}.cb .acts{align-items:center}.cb .btn{padding:10px 16px;font-size:15px}.cb .acts a{text-decoration:underline;padding:0 6px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.cb{animation:cbin .4s ease backwards}@keyframes cbin{from{transform:translateY(30px);opacity:0}}}
footer a{color:var(--ac)}
footer{border-top:1px solid var(--line);padding:24px 0 36px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
@media (max-width:860px){.shell{grid-template-columns:1fr}#mt{display:block}#app{padding:0 20px}

<footer><div class="w">Учебный проект: «Разработка веб-ресурса “База знаний по информационной безопасности”». Материалы носят образовательный характер; нормативные требования уточняйте в действующих редакциях первоисточников.<br><a href="#/privacy">Политика конфиденциальности</a> · <a href="#/cookies">Использование файлов cookie</a></div></footer>
<script>
const S=[
{id:"basics",t:"Основы",d:"Базовые понятия: цели защиты, риски и классификация данных.",lead:"Информационная безопасность — это защита информации и систем, которые её обрабатывают, от случайных и умышленных воздействий. Раздел объясняет понятия, на которых строится всё остальное.",
tp:[{t:"Триада CIA: конфиденциальность, целостность, доступность",p:"Конфиденциальность означает, что данные видят только те, кому разрешено. Целостность гарантирует, что данные не изменены без разрешения. Доступность — это возможность получить данные и сервисы тогда, когда они нужны. Любая мера защиты направлена минимум на одну из этих целей.",k:["Шифрование защищает конфиденциальность.","Хеши и подписи защищают целостность.","Резервные копии и резервирование серверов поддерживают доступность.","Усиление одной цели может ослабить другую: строгие ограничения доступа снижают удобство."]},
{t:"Угрозы, уязвимости и риски",p:"Актив — то, что нужно защищать (данные, сервер, репутация). Угроза — потенциальная причина вреда, уязвимость — слабое место, которым она может воспользоваться. Риск оценивают как сочетание вероятности события и размера ущерба.",k:["Определите активы и их ценность.","Оцените вероятность и ущерб по каждой угрозе.","Выберите стратегию: снизить, передать (страхование), принять или избежать риск."]},
{t:"Классификация информации",p:"Данные делят по уровню важности, чтобы защищать их соразмерно. Например: публичные, внутренние, конфиденциальные и строго конфиденциальные. Уровень определяет, кто имеет доступ, как данные хранятся и передаются.",k:["Назначьте владельца каждому набору данных.","Маркируйте документы и хранилища.","Пересматривайте классификацию при изменении ценности данных."]}]},
{id:"threats",t:"Угрозы",d:"Фишинг, вредоносное ПО, атаки на веб-приложения.",lead:"Атакующие используют как технические слабости, так и человеческие ошибки. Ниже — самые распространённые типы атак и способы им противостоять.",
tp:[{t:"Фишинг и социальная инженерия",p:"Фишинг — рассылка поддельных писем, сообщений или сайтов, цель которых украсть пароли, данные карт или заставить установить вредоносную программу. Социальная инженерия шире: злоумышленник давит на срочность, доверие или авторитет, чтобы человек сам совершил нужное действие.",k:["Проверяйте адрес отправителя и реальную ссылку перед переходом.","Не открывайте неожиданные вложения.","Сообщайте о подозрительных письмах в службу безопасности."]},
{t:"Вредоносное ПО",p:"Вирусы заражают файлы, черви распространяются по сети самостоятельно, трояны маскируются под полезные программы, шпионское ПО следит за действиями пользователя, а программы-вымогатели шифруют данные и требуют выкуп.",k:["Своевременно обновляйте систему и приложения.","Используйте антивирус или EDR-решение.","Храните офлайн-копии, чтобы восстановиться после шифровальщика."]},
{t:"SQL-инъекции и атаки на веб-приложения",p:"Если приложение подставляет ввод пользователя прямо в текст запроса к базе данных, атакующий может добавить собственные команды и получить или изменить чужие данные. Это одна из классических уязвимостей из списка OWASP Top 10.",k:["Применяйте параметризованные запросы.","Проверяйте и фильтруйте входные данные.","Давайте учётной записи БД только необходимые права."]}]},
{id:"defense",t:"Защита",d:"Пароли и MFA, резервные копии, управление доступом.",lead:"Эффективная защита многоуровневая: если одна мера не сработала, её подстраховывает другая. Здесь собраны базовые практические меры.",
tp:[{t:"Пароли и многофакторная аутентификация",p:"Длинный уникальный пароль защищает от подбора и от атак с повторным использованием утёкших паролей. Многофакторная аутентификация (MFA) добавляет второй фактор — код из приложения или аппаратный ключ, поэтому одного украденного пароля недостаточно.",k:["Используйте менеджер паролей и разные пароли для разных сайтов.","Предпочитайте приложения-аутентификаторы и ключи безопасности коду из SMS.","Никому не сообщайте одноразовые коды."]},
{t:"Резервное копирование: правило 3-2-1",p:"Храните три копии важных данных на двух разных типах носителей, причём одну копию — вне основного места (в другом здании или офлайн). Резервная копия, из которой ни разу не пробовали восстановиться, не гарантирует результата.",k:["Автоматизируйте создание копий.","Защитите копии от перезаписи вредоносным ПО.","Регулярно проверяйте восстановление и описывайте порядок действий."]},
{t:"Управление доступом и принцип наименьших привилегий",p:"Аутентификация отвечает на вопрос «кто вы?», авторизация — «что вам разрешено?». Принцип наименьших привилегий требует выдавать учётной записи только те права, которые нужны для работы, чтобы взлом одной записи не привёл к потере всего.",k:["Применяйте ролевую модель доступа (RBAC).","Регулярно пересматривайте права и удаляйте неиспользуемые учётные записи.","Разделяйте административные и обычные учётные записи."]}]},
{id:"crypto",t:"Криптография",d:"Шифрование, хеширование, подписи и сертификаты.",lead:"Криптография превращает данные в форму, недоступную посторонним, и позволяет проверять подлинность. Её методы лежат в основе HTTPS, мессенджеров и банковских приложений.",
tp:[{t:"Симметричное и асимметричное шифрование",p:"Симметричное шифрование (например, AES) использует один общий ключ и работает быстро, поэтому подходит для больших объёмов данных. Асимметричное (например, RSA) использует пару ключей — открытый и закрытый, что решает задачу безопасной передачи ключа. На практике их комбинируют.",k:["Не придумывайте собственные алгоритмы шифрования.","Закрытый ключ нужно защищать лучше всего остального.","Выбирайте проверенные библиотеки и актуальные длины ключей."]},
{t:"Хеширование",p:"Хеш-функция превращает данные в «отпечаток» фиксированной длины, по которому нельзя восстановить исходное значение; при малейшем изменении данных хеш полностью меняется. Пароли хранят в виде хешей с уникальной «солью», используя медленные алгоритмы bcrypt, scrypt или Argon2.",k:["Не используйте MD5 и SHA-1 для защиты.","Добавляйте уникальную соль к каждому паролю.","Для проверки целостности файлов применяйте SHA-256."]},
{t:"Цифровая подпись и сертификаты",p:"Цифровая подпись — это хеш документа, зашифрованный закрытым ключом автора. Любой может проверить её открытым ключом и убедиться, что документ не изменён и подписан именно этим владельцем. Сертификаты, выданные удостоверяющими центрами, связывают открытый ключ с конкретным человеком или сайтом.",k:["Проверяйте срок действия и издателя сертификата.","Храните закрытые ключи на защищённых носителях."]}]},
{id:"network",t:"Сети",d:"Межсетевые экраны, IDS/IPS, TLS, HTTPS и VPN.",lead:"Сеть — главный путь, по которому проходят и данные, и атаки. Сетевые средства защиты фильтруют трафик, обнаруживают вторжения и шифруют соединения.",
tp:[{t:"Межсетевые экраны (файрволы)",p:"Файрвол разрешает или блокирует трафик по правилам: адресам, портам и протоколам. Хорошая практика — запрет по умолчанию: разрешено только то, что явно необходимо. Сеть делят на сегменты, чтобы взлом одного узла не открывал доступ ко всему остальному.",k:["Закрывайте неиспользуемые порты.","Разделяйте пользовательскую, серверную и гостевую сети.","Регулярно проверяйте правила и журналы."]},
{t:"Системы обнаружения и предотвращения вторжений (IDS/IPS)",p:"IDS анализирует трафик и события, ищет подозрительное поведение и отправляет оповещения. IPS идёт дальше и может автоматически блокировать атаку. Обнаружение строится на сигнатурах известных атак и на поиске аномалий.",k:["Настройте оповещения, чтобы не тонуть в ложных срабатываниях.","Передавайте события в централизованную систему (SIEM)."]},
{t:"TLS, HTTPS и VPN",p:"TLS шифрует соединение между браузером и сайтом; значок замка в HTTPS означает, что канал зашифрован, а сертификат соответствует адресу. VPN создаёт зашифрованный туннель до другой сети — полезно в публичном Wi-Fi и для удалённого доступа к корпоративным ресурсам.",k:["Не игнорируйте предупреждения браузера о сертификате.","VPN скрывает трафик от локальной сети, но не от сайтов, на которые вы входите под своей учётной записью."]}]},
{id:"law",t:"Право и стандарты",d:"ISO/IEC 27001, GDPR, закон 152-ФЗ.",lead:"Информационная безопасность регулируется стандартами и законами. Они определяют, какие меры организация обязана принимать и какую ответственность несёт.",
tp:[{t:"ISO/IEC 27001",p:"Международный стандарт описывает систему менеджмента информационной безопасности (СМИБ): определение области действия, оценка рисков, выбор мер защиты, аудит и постоянное улучшение. Организации могут пройти сертификацию у независимых аудиторов.",k:["Необходима поддержка руководства.","Меры выбираются на основе рисков, а не по фиксированному списку."]},
{t:"GDPR",p:"Общий регламент ЕС по защите данных устанавливает принципы законности, ограничения целей и минимизации данных и даёт людям право получать, исправлять и удалять свои данные. О некоторых утечках нужно уведомлять надзорный орган, как правило, в течение 72 часов.",k:["Собирайте только необходимые данные.","Фиксируйте, зачем и на каком основании обрабатываете данные."]},
{t:"Закон 152-ФЗ «О персональных данных»",p:"Российский закон регулирует сбор, хранение и использование персональных данных. Оператор обязан получать согласие субъекта, ограничивать цели обработки и принимать правовые, организационные и технические меры защиты. За нарушения предусмотрена ответственность.",k:["Определите, какие персональные данные вы обрабатываете.","Назначьте ответственного за обработку данных.","Уточняйте актуальную редакцию закона на официальных ресурсах."]}]}
];
const MORE={
basics:[{t:"Расширенные модели и количественная оценка рисков",p:"Помимо триады CIA используют свойства подлинности (authenticity), подотчётности (accountability), неотказуемости (non-repudiation) и надёжности; гексада Паркера добавляет владение и полезность. Принцип эшелонированной защиты (defense in depth) требует независимых уровней: физического, сетевого, уровня узла, приложения и данных, а также организационных мер. Процесс управления рисками по ISO/IEC 27005: установление контекста, идентификация, анализ, оценка, обработка и мониторинг; остаточный риск принимает руководство. Количественная оценка: ALE = SLE × ARO, где SLE = стоимость актива × фактор подверженности (EF), а ARO — ожидаемое число инцидентов в год.",k:["Модель угроз STRIDE: подмена (Spoofing), изменение (Tampering), отказ от авторства (Repudiation), раскрытие информации (Information disclosure), отказ в обслуживании (DoS), повышение привилегий (Elevation of privilege).","Пример: актив 1 000 000 ₽, EF 40 %, ARO 0,5 → SLE 400 000 ₽, ALE 200 000 ₽ в год; мера защиты оправдана, если стоит меньше снижения ALE.","Стратегии обработки риска: снижение, передача, принятие, избегание."]}],
threats:[{t:"Жизненный цикл атаки, MITRE ATT&CK и OWASP Top 10",p:"Модель Cyber Kill Chain описывает семь этапов: разведка, подготовка средств, доставка, эксплуатация, установка, управление (C2) и действия по цели. База MITRE ATT&CK систематизирует тактики и техники реальных атак (начальный доступ, исполнение, закрепление, повышение привилегий, обход защиты, получение учётных данных, перемещение внутри сети, эксфильтрация, воздействие) и применяется для оценки покрытия обнаружения. В OWASP Top 10 (редакция 2021) входят нарушение контроля доступа, криптографические сбои, инъекции, небезопасное проектирование, ошибки конфигурации, уязвимые компоненты, ошибки аутентификации, нарушения целостности ПО и данных, недостатки журналирования и SSRF.",k:["XSS: внедрение скрипта в страницу; защита — экранирование вывода по контексту и политика Content-Security-Policy.","CSRF: заставляет браузер жертвы отправить запрос с её сессией; защита — токены, атрибут SameSite у cookie.","DDoS: объёмные атаки (насыщение канала), атаки на протоколы (SYN flood) и на уровень приложения (HTTP flood); защита — фильтрация на стороне провайдера, CDN, ограничение частоты запросов."]}],
defense:[{t:"Аутентификация по NIST SP 800-63B и модели контроля доступа",p:"Современные рекомендации NIST SP 800-63B (редакция 4) требуют: длина пароля не менее 15 символов, если он единственный фактор, и не менее 8, если используется как один из факторов; допускать не менее 64 символов; не навязывать правила состава («одна цифра, один символ») и периодическую смену без признаков компрометации; сверять пароли со списками скомпрометированных; ограничивать число попыток. Одноразовые коды TOTP описаны в RFC 6238; наиболее устойчивы к фишингу аппаратные ключи и passkeys на базе FIDO2/WebAuthn, привязанные к домену сайта. Модели доступа: DAC (владелец назначает права), MAC (метки секретности, решает политика), RBAC (права связаны с ролями) и ABAC (решение по атрибутам пользователя, ресурса и контекста).",k:["Резервное копирование: полное, инкрементное (изменения с прошлой копии любого типа) и дифференциальное (изменения с последней полной).","RPO — допустимая потеря данных по времени, RTO — допустимое время восстановления; от них зависит частота копирования и архитектура.","Неизменяемые (immutable) копии и офлайн-хранение защищают от шифровальщиков."]}],
crypto:[{t:"Алгоритмы, режимы работы и постквантовая криптография",p:"AES — блочный шифр с блоком 128 бит и ключами 128, 192 или 256 бит. Режим ECB небезопасен, так как одинаковые блоки дают одинаковый шифртекст; CBC требует непредсказуемого вектора инициализации и не защищает целостность; предпочтителен аутентифицированный режим GCM (AEAD), где nonce нельзя повторять с одним ключом. В российских стандартах применяются блочные шифры «Кузнечик» и «Магма» (ГОСТ Р 34.12-2015) и хеш-функция «Стрибог» (ГОСТ Р 34.11-2012). RSA считается достаточным при модуле от 2048 бит (рекомендуется 3072), эллиптические кривые (P-256, Ed25519, X25519) дают сопоставимую стойкость при коротких ключах. Для хранения паролей OWASP рекомендует Argon2id: минимум 19 МиБ памяти, 2 итерации, параллелизм 1.",k:["Обмен ключами по Диффи — Хеллману (в том числе на эллиптических кривых) создаёт общий секрет по открытому каналу.","Против квантового компьютера уязвимы RSA и ECC; NIST стандартизировал ML-KEM (FIPS 203), ML-DSA (FIPS 204) и SLH-DSA (FIPS 205).","Для симметричных шифров запас прочности обеспечивает ключ 256 бит."]}],
network:[{t:"Протокол TLS 1.3, типы файрволов и защищённые туннели",p:"TLS 1.3 (RFC 8446) завершает рукопожатие за один круговой обмен (1-RTT), всегда использует эфемерный обмен ключами (EC)DHE, что обеспечивает прямую секретность (forward secrecy), и допускает только AEAD-шифры, такие как AES-GCM и ChaCha20-Poly1305. Обмен ключами через RSA и устаревшие алгоритмы удалены. Режим 0-RTT ускоряет возобновление, но уязвим к повторному воспроизведению запросов. Браузер проверяет цепочку сертификатов до доверенного корневого центра, срок действия, соответствие имени хоста и статус отзыва; заголовок HSTS запрещает возврат к HTTP.",k:["Файрволы: пакетные фильтры (L3/L4), с контролем состояния соединений (stateful), прикладного уровня (proxy, WAF) и NGFW с глубокой инспекцией и распознаванием приложений.","IPsec (режимы туннеля и транспорта, протоколы ESP и IKEv2) и WireGuard обеспечивают шифрованные VPN-каналы.","DNSSEC подписывает DNS-ответы и защищает от подмены, но не шифрует запросы; для этого служат DoT и DoH."]}],
law:[{t:"Система нормативных документов: РФ, ЕС, международные стандарты",p:"В России основу составляют законы № 149-ФЗ «Об информации, информационных технологиях и о защите информации», № 152-ФЗ «О персональных данных» и № 187-ФЗ «О безопасности критической информационной инфраструктуры». Требования по защите конкретизируют приказы ФСТЭК России: № 17 от 11.02.2013 для государственных информационных систем и № 21 от 18.02.2013 для персональных данных. Для финансовых организаций применяется ГОСТ Р 57580.1-2017. Стандарт ISO/IEC 27001:2022 в приложении A содержит 93 меры в четырёх группах: организационные (37), в отношении персонала (8), физические (14) и технологические (34). GDPR в статье 32 требует мер, соразмерных риску, в статье 33 — уведомления надзорного органа об утечке в течение 72 часов; штрафы достигают 20 млн евро или 4 % мирового оборота.",k:["Для нормативных требований всегда сверяйтесь с действующей редакцией на официальных ресурсах (publication.pravo.gov.ru, fstec.ru, eur-lex.europa.eu).","Сертификация по ISO/IEC 27001 проводится независимым органом; область действия СМИБ и заявление о применимости мер (SoA) обязательны."]}]};

S.push({id:"articles",t:"Статьи",d:"Пароли, фишинг, шифрование, ГОСТы и ФСТЭК: основы одной статьёй.",lead:"Пять вводных статей по ключевым темам: от личной безопасности до российских стандартов и регулятора. Каждая даёт опорные понятия и практические выводы.",
tp:[{t:"Пароли: как создавать и хранить",p:"Надёжность пароля определяется длиной и непредсказуемостью, а не «хитрыми» заменами букв. Лучше всего работает длинная фраза из нескольких случайных слов или случайная строка из менеджера паролей. Главные риски — повторное использование одного пароля на разных сайтах и утечки баз, после которых пароли проверяют автоматически.",k:["Не менее 12–16 символов, уникальный пароль для каждого сервиса.","Включите многофакторную аутентификацию там, где она есть.","Проверяйте свою почту на утечки и меняйте пароль после компрометации."]},
{t:"Фишинг: как распознать и что делать",p:"Фишинг имитирует письмо банка, службы доставки, коллеги или руководителя и подталкивает к быстрому действию: перейти по ссылке, ввести данные, открыть файл. Признаки — срочность, угрозы блокировки, незнакомый или похожий домен, ошибки в тексте, просьба обойти обычный порядок согласования.",k:["Наведите курсор на ссылку и сверьте домен, не переходя по ней.","Заходите в сервисы через закладки, а не через ссылки из писем.","Если данные уже введены: смените пароль, включите MFA, сообщите в службу безопасности или банк."]},
{t:"Шифрование: что и зачем",p:"Шифрование превращает данные в нечитаемый вид без ключа. Различают защиту данных при хранении (шифрование диска и файлов) и при передаче (TLS, VPN, защищённые мессенджеры). Стойкость определяется алгоритмом, длиной ключа и тем, как хранится сам ключ: утечка ключа обесценивает любое шифрование.",k:["Включите шифрование диска (BitLocker, FileVault, LUKS) на ноутбуках и телефонах.","Используйте проверенные алгоритмы и библиотеки, а не самописные.","Храните ключи отдельно от зашифрованных данных."]},
{t:"ГОСТы в области информационной безопасности",p:"Государственные стандарты задают единые термины, требования и алгоритмы. Среди важных: ГОСТ Р 50922 (основные термины защиты информации), ГОСТ Р ИСО/МЭК 27001 (система менеджмента информационной безопасности), ГОСТ Р 57580.1 (безопасность финансовых операций), ГОСТ Р 56939 (разработка безопасного программного обеспечения). В криптографии используются ГОСТ Р 34.10-2012 (электронная подпись), ГОСТ Р 34.11-2012 («Стрибог») и ГОСТ 34.12-2018 («Кузнечик» и «Магма»).",k:["Применение конкретного ГОСТа может быть обязательным для отрасли или добровольным.","Актуальность редакции проверяйте на сайте Росстандарта или в реестре документов."]},

function rate(p){
  const c={len:p.length>=12,low:/[a-zа-я]/.test(p),up:/[A-ZА-Я]/.test(p),dig:/\d/.test(p),sym:/[^A-Za-zА-Яа-я0-9]/.test(p)};
  const common=COMMON.some(w=>p.toLowerCase().includes(w));
  c.com=!common;
  let s=Math.min(p.length,16)*3+[c.low,c.up,c.dig,c.sym].filter(Boolean).length*8;
  if(p.length>=12)s+=10;if(p.length>=16)s+=10;
  if(/(.)\1{2,}/.test(p))s-=15;
  if(/(012|123|234|345|456|567|678|789|abc|bcd|cde|qwe|asd)/i.test(p))s-=15;
  if(common)s=Math.min(s,15);
  s=Math.max(0,Math.min(100,s));
  return{s,c,l:s<40?"red":s<70?"yellow":"green"};
}

function authPage(h){
  $("#app").innerHTML=h+`<div class="pw"><h2 style="font-size:1.2rem;margin-bottom:10px">Вход и регистрация</h2><div class="form">
<label>Логин<input id="a_l" maxlength="30" autocomplete="username"></label>

    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));u[l]={salt,role:Object.keys(u).length?"user":"admin",hash:await hsh(P(),salt),profile:{...DEF,visited:[],nick:l}};sv("kb_users",u);enter(l)});
}

function statsPage(){

  const docs=ld("kb_traffic",[]),us=ld("kb_users",{});

  const td=docs.filter(d=>d.day===today).length,by={};
  docs.forEach(d=>by[d.page]=(by[d.page]||0)+1);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=rows.length?rows[0][1]:1;
  const days=[...Array(7)].map((_,i)=>{const k=new Date(Date.now()-(6-i)*864e5);return{k:k.toLocaleDateString("sv"),l:k.toLocaleDateString("ru",{day:"numeric",month:"short"})}});
  days.forEach(d=>d.n=docs.filter(x=>x.day===d.k).length);const dm=Math.max(1,...days.map(d=>d.n));
  $("#app").innerHTML=h+`<div class="kpi"><div><b>${total}</b>Всего просмотров</div><div><b>${uniq}</b>Уникальных посетителей</div><div><b>${td}</b>Просмотров сегодня</div><div><b>${rows.length?esc(TITLE[rows[0][0]]||"Главная"):"—"}</b>Самая популярная страница</div></div>
<div class="topic"><h2>Просмотры за 7 дней</h2><div class="cols" role="img" aria-label="Просмотры по дням">${days.map(d=>`<div>${d.n}<i style="height:${Math.round(d.n/dm*120)}px"></i>${d.l}</div>`).join("")}</div></div>
<div class="topic"><h2>Популярные страницы</h2>${rows.length?rows.map(r=>`<div class="hb"><span>${esc(TITLE[r[0]]||"Главная")}</span><span class="t"><i style="width:${Math.round(r[1]/mx*100)}%"></i></span><b>${r[1]}</b></div>`).join(""):"<p>Данных пока нет. Откройте несколько страниц и обновите статистику.</p>"}</div>
<p class="note">Учитываются последние 1000 просмотров. Статистика хранится в этом браузере и учитывает только просмотры с этого устройства: сайт без собственного сервера не может собирать данные со всех посетителей.</p>
${adm()?`<div class="topic"><h2>Перенос и объединение данных</h2><p>${persist()?"Данные сохраняются в этом браузере и остаются после закрытия страницы.":"Браузер запрещает постоянное хранение, поэтому данные живут только до закрытия вкладки."} Чтобы собрать статистику с нескольких устройств, нажмите «Показать данные» на каждом, скопируйте текст и вставьте его в поле на главном устройстве, затем нажмите «Объединить». Повторные записи не дублируются.</p>
<label for="xj" class="lead" style="font-size:1rem">Данные (JSON)</label><textarea id="xj" rows="4" style="width:100%;padding:12px;font:13px monospace;border:2px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"></textarea>
<div class="acts" style="margin-top:10px"><button class="btn ghost" id="ex" type="button">Показать данные</button><button class="btn" id="mg" type="button">Объединить</button><button class="btn ghost" id="cl" type="button">Очистить статистику</button></div><p id="xm" class="lead" style="font-size:1rem" aria-live="polite"></p></div>`:""}
<button class="btn ghost" id="rf" type="button">Обновить</button></div>`;
  $("#rf").addEventListener("click",statsPage);
  $("#ex")?.addEventListener("click",()=>{$("#xj").value=JSON.stringify(ld("kb_traffic",[]))});
  $("#cl")?.addEventListener("click",()=>{if(confirm("Удалить всю статистику посещений на этом устройстве?")){sv("kb_traffic",[]);statsPage()}});
  $("#mg")?.addEventListener("click",()=>{try{const a=JSON.parse($("#xj").value);if(!Array.isArray(a))throw 0;const cur=ld("kb_traffic",[]),seen=new Set(cur.map(e=>e.t+e.uid+e.page));let n=0;
    a.forEach(e=>{if(e&&typeof e.page==="string"&&typeof e.uid==="string"&&typeof e.day==="string"&&Number.isFinite(e.t)){const k=e.t+e.uid+e.page;if(!seen.has(k)){seen.add(k);cur.push({page:e.page,uid:e.uid,t:e.t,day:e.day});n++}}});
    sv("kb_traffic",cur.sort((x,y)=>x.t-y.t).slice(-1000));statsPage();$("#xm").textContent="Добавлено записей: "+n}catch(e){$("#xm").textContent="Не удалось прочитать данные. Вставьте текст, полученный кнопкой «Показать данные»."}});
}

<td>${can(x)?`<select class="rs2" data-u="${esc(x.id)}" aria-label="Роль пользователя">${(O?["user","moderator","admin"]:["user","moderator"]).map(k=>`<option value="${k}"${x.role===k?" selected":""}>${RNAME[k]}</option>`).join("")}</select>`:RNAME[x.role]||x.role}</td>
<td><button class="btn ghost dn del" data-u="${esc(x.id)}" type="button" ${can(x)?"":"disabled"}>Удалить</button></td></tr>`).join("")}</tbody></table></div>
<div class="topic"><h2>Что означают роли</h2><ul><li><b>Пользователь</b> — читает материалы и ведёт профиль.</li><li><b>Модератор</b> — дополнительно просматривает статистику.</li><li><b>Администратор</b> — статистика, управление пользователями и модераторами.</li><li><b>Владелец</b> — всё перечисленное плюс назначение администраторов.</li></ul></div></div>`;
  const done=t=>{adminMsg=t;adminPage()},fail=()=>done("Операция не выполнена: недостаточно прав.");
  document.querySelectorAll(".rs2").forEach(s=>s.onchange=()=>F.updateDoc(F.doc(fs,"users",s.dataset.u),{role:s.value}).then(()=>done("Роль изменена: "+RNAME[s.value]+".")).catch(fail));
  document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить пользователя? Его профиль будет стёрт, а вход закрыт."))return;try{await F.deleteDoc(F.doc(fs,"users",b.dataset.u));await F.setDoc(F.doc(fs,"blocked",b.dataset.u),{t:Date.now()});done("Пользователь удалён.")}catch(e){fail()}});
};
A.onAuthStateChanged(au,async u=>{
  try{
    if(!u){ME=null;acct=null;prof=null;updTop();route();return}
    if((await F.getDoc(F.doc(fs,"blocked",u.uid))).exists()){window.__blk=true;await A.signOut(au);return}
    const ref=F.doc(fs,"users",u.uid);let s=await F.getDoc(ref);
    if(!s.exists()){await F.setDoc(ref,{email:u.email||"",nick:u.displayName||(u.email||"").split("@")[0],role:u.uid===OWNER_UID?"owner":"user",profile:{...DEF,visited:[]}});s=await F.getDoc(ref)}
    let d=s.data();if(u.uid===OWNER_UID&&d.role!=="owner"){await F.updateDoc(ref,{role:"owner"});d.role="owner"}
    ME={uid:u.uid,role:d.role};acct=u.uid;prof={...DEF,visited:[],...d.profile};if(!prof.nick)prof.nick=d.nick||"";
    updTop();route();
  }catch(e){console.error(e);ME=null;acct=null;prof=null;updTop();route()}
});
}catch(e){console.error(e);legacy()}
</script>
